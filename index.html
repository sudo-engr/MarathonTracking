<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marathon Tracking</title>
  <link rel="stylesheet" href="styles.css?v=10" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <p class="eyebrow">MARATHON TRACKING</p>
      <h1 hidden>여러 러너의 기록을 <span>한 화면에서</span></h1>
      <p class="lede" hidden>대회를 선택하고 배번을 저장하세요. 기록은 원본 사이트를 기준으로 확인합니다.</p>
    </header>

    <section class="panel setup-panel">
      <div class="panel-title"><span>01</span><h2>대회</h2></div>
      <label for="eventSearch">대회 검색</label>
      <input id="eventSearch" type="search" placeholder="예: 춘천, 서울, 2026" autocomplete="off" />
      <div id="eventList" class="event-list" aria-live="polite"></div>
    </section>

    <section class="panel bib-panel">
      <div class="panel-title"><span>02</span><h2>배번</h2></div>
      <p id="selectedEvent" class="selected-event">먼저 대회를 선택하세요.</p>
      <form id="bibForm" class="bib-form">
        <input id="bibInput" placeholder="이름 또는 배번 검색 (예: 홍길동, 1234)" aria-label="이름 또는 배번 검색" autocomplete="off" />
        <button type="submit">검색</button>
      </form>
      <div id="candidateList" class="candidate-list" aria-live="polite"></div>
      <div id="bibList" class="bib-list"></div>
      <div class="actions">
        <button id="shareBtn" class="button secondary">공유 링크 복사</button>
        <button id="clearBtn" class="button ghost">전체 삭제</button>
      </div>
      <p id="saveStatus" class="privacy-note" role="status"></p>
    </section>

    <section class="panel course-panel">
      <div id="courseMap" class="course-map" hidden>
        <div class="course-map-title"><div class="course-heading"><span>03</span><strong>코스</strong><span id="courseEventName" class="course-event">2026 춘천마라톤</span></div><span id="courseSource">|&nbsp; GPX Road</span></div>
        <p class="course-note">주자 위치는 통과 기록·페이스·경사·날씨로 추정하며 실제 GPS 위치와 다를 수 있습니다.</p>
        <iframe
          title="2026 춘천마라톤 코스 지도"
          id="courseMapFrame"
          allow="fullscreen"
          allowfullscreen
          src="gpx-viewer.html?url=GPX/2026_춘천_full.gpx"
          loading="lazy"
          referrerpolicy="no-referrer"
          scrolling="no"
        ></iframe>
        <div id="courseMap10k" hidden>
          <div class="course-subtitle">10K 코스</div>
          <iframe title="10K 코스 지도" id="courseMapFrame10k" allow="fullscreen" allowfullscreen loading="lazy" referrerpolicy="no-referrer" scrolling="no"></iframe>
        </div>
      </div>
    </section>

    <section class="panel results-panel">
      <div class="panel-title"><span>04</span><h2>기록</h2><button id="refreshBtn" class="button primary">기록 조회</button></div>
      <div id="status" class="status" role="status">조회할 배번을 추가하세요.</div>
      <div id="results" class="results"></div>
    </section>

    <footer>
      <span>원본 기록은 각 공식 사이트에서 확인하세요.</span>
      <a href="https://myresult.co.kr/" target="_blank" rel="noreferrer">MyResult ↗</a>
      <a href="https://smartchip.co.kr/" target="_blank" rel="noreferrer">SmartChip ↗</a>
    </footer>
  </main>
  <dialog id="nameDialog"><form method="dialog" id="nameForm"><h3>이름 수정</h3><input id="nameEditInput" maxlength="60" autocomplete="off"><div><button value="cancel">취소</button><button id="nameSave" value="save">저장</button></div></form></dialog>
  <script src="app.js?v=12"></script>
</body>
</html>
