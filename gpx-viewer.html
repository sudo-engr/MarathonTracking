<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPX Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #ffffff !important;
        }
        .gpx-viewer-wrapper {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            width: 100%;
            box-sizing: border-box;
            max-width: 900px;
            margin: 0 auto;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: none;
            background: #ffffff;
            height: auto !important;
            max-height: fit-content;
        }
        .gpx-map {
            height: 450px;
            width: 100%;
            z-index: 1;
        }
        .gpx-chart-container {
            position: relative;
            height: 180px;
            width: 100%;
            padding: 12px 16px 0px 16px;
            box-sizing: border-box;
            background: #ffffff;
            border-top: 1px solid #e5e7eb;
        }
        #gpx-elevation-chart {
            display: block;
        }
        .map-pin { width: 14px; height: 14px; }
        .map-pin .pin-dot, .chart-hover-pin {
            display: grid; place-items: center; width: 14px; height: 14px;
            border: 2px solid #fff; border-radius: 50%; background: var(--pin-color, #10b981);
            box-shadow: 0 1px 4px #0005; box-sizing: border-box;
        }
        .map-pin.runner, .map-pin.runner .pin-dot { width: 24px; height: 24px; }
        .map-pin.runner .pin-dot { color: #fff; font-size: 11px; font-weight: 700; }
        .pin-label {
            position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
            white-space: nowrap; padding: 4px 6px; border-radius: 4px; background: #fff;
            color: #18211f; font: 12px/1.4 sans-serif; box-shadow: 0 1px 4px #0004;
            pointer-events: none;
        }
        .map-pin.start .pin-label { bottom: auto; top: -5px; left: auto; right: calc(100% + 6px); transform: none; }
        .map-pin.finish .pin-label { bottom: auto; top: -5px; left: calc(100% + 6px); transform: none; }

        @media (max-width: 768px) {
            .gpx-map {
                height: 290px;
            }
            .gpx-chart-container {
                height: 135px;
                padding: 10px 12px 0px 12px;
            }
            .gpx-summary {
                height: auto !important;
                max-height: fit-content !important;
                flex: 0 0 auto !important;
                align-items: center;
                box-sizing: border-box;
            }
        }
        .gpx-loading {
            padding: 40px;
            text-align: center;
            font-size: 15px;
            color: #6b7280;
            background: #f9fafb;
        }
        .gpx-loading-steps {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 30px 20px;
            background: #f9fafb;
        }
        .loading-step {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #9ca3af;
            transition: color 0.3s ease, opacity 0.3s ease;
        }
        .loading-step.active {
            color: #10b981;
            font-weight: 600;
        }
        .loading-step.done {
            color: #6b7280;
        }
        .loading-step .step-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }
        .loading-step.active .step-icon::after {
            content: '';
            display: block;
            width: 14px;
            height: 14px;
            border: 2px solid #10b981;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loading-step.done .step-icon::after {
            content: '✓';
        }
        .loading-step.pending .step-icon::after {
            content: '○';
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .maplibregl-canvas {
            cursor: crosshair;
        }
        .gpx-summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding: 16px;
            background: #f9fafb;
            border-top: 1px solid #e5e7eb;
            font-size: 13px;
            box-sizing: border-box;
        }
        @media (max-width: 768px) {
            .gpx-summary {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
                padding: 12px;
            }
        }
        .summary-item {
            text-align: center;
            padding: 8px 6px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        .summary-label {
            display: block;
            color: #6b7280;
            font-size: 11px;
            margin-bottom: 4px;
            font-weight: 500;
        }
        .summary-value {
            color: #111827;
            font-weight: 600;
            font-size: 14px;
        }
        .summary-value.highlight-green {
            color: #10b981;
        }
        .summary-value.highlight-blue {
            color: #3b82f6;
        }
    </style>
</head>
<body>

<div class="gpx-viewer-wrapper">
    <div id="gpx-loading" class="gpx-loading-steps">
        <div id="step-read" class="loading-step active"><span class="step-icon"></span>GPX 파일 읽는 중...</div>
        <div id="step-map" class="loading-step pending"><span class="step-icon"></span>지도 생성 중...</div>
        <div id="step-chart" class="loading-step pending"><span class="step-icon"></span>고도 그래프 생성 중...</div>
        <div id="step-analysis" class="loading-step pending"><span class="step-icon"></span>코스 분석 중...</div>
        <div id="step-done" class="loading-step pending"><span class="step-icon"></span>완료</div>
    </div>
    <div id="gpx-map" class="gpx-map" style="display: none;"></div>
    <div id="gpx-chart-container" class="gpx-chart-container" style="display: none;">
        <canvas id="gpx-elevation-chart"></canvas>
    </div>
    <div id="gpx-summary" class="gpx-summary" style="display: none;">
        <div class="summary-item"><span class="summary-label">총 거리</span><span class="summary-value" id="summary-distance">-</span></div>
        <div class="summary-item"><span class="summary-label">누적 상승 (D+)</span><span class="summary-value highlight-green" id="summary-ele-gain">-</span></div>
        <div class="summary-item"><span class="summary-label">누적 하강 (D-)</span><span class="summary-value highlight-blue" id="summary-ele-loss">-</span></div>
        <div class="summary-item"><span class="summary-label">최고/최저 고도</span><span class="summary-value" id="summary-ele-maxmin">-</span></div>
    </div>
</div>

<!-- OpenFreeMap vector basemap (reviewed, pinned browser distributions) -->
<link rel="stylesheet" href="vendor/maplibre-gl-5.24.0.css" />
<script src="vendor/maplibre-gl-5.24.0.js"></script>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- RunRuun Elevation Engine (Production Standard) -->
<script src="runruun-elevation.js"></script>
<script src="runner-prediction.js"></script>
<script src="course-weather.js"></script>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const GPX_URL = urlParams.get('url') || 'GPX/2026_춘천_full.gpx';
    const FALLBACK_URL = urlParams.get('fallback') || '';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF5cnJwYXF2d2ZlYWNvd21vc2d2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MDYyMzMsImV4cCI6MjEwODA4MjIzM30.xLvhRTDA7MSrYiGF7n5e_dGFPw4sxohq-5tWuBSp95E';

    let gpxChartInstance = null;
    let mapInstance = null;
    let hoverMarkerInstance = null;
    let displayChartData = [];
    let routePath = [];
    let runnerMarkers = [];
    const runnerPinColors = ['#d95535', '#247ee6', '#16a36a', '#8b5cf6', '#d49a00', '#e0529b'];
    let latestRunners = [];
    let predictionRoute = null;
    let courseStart = null;
    let weatherAt = null;
    let weatherKey = '';
    let weatherLoading = false;
    let weatherCheckedAt = 0;
    async function updateWeather() {
        const date = latestRunners[0]?.date;
        if (!date || !courseStart || weatherLoading) return;
        const key = `${date}:${courseStart.lat}:${courseStart.lon}`;
        if (key === weatherKey && Date.now() - weatherCheckedAt < (weatherAt ? 1800000 : 300000)) return;
        weatherKey = key;
        weatherCheckedAt = Date.now();
        weatherAt = null;
        weatherLoading = true;
        showRunners(latestRunners);
        const loaded = await CourseWeather.load(date, courseStart);
        weatherLoading = false;
        weatherAt = loaded;
        showRunners(latestRunners);
        if (latestRunners[0]?.date !== date) updateWeather();
    }
    function createMapMarker(point, label, color, kind = 'course', number = '') {
        const element = document.createElement('div');
        element.className = `map-pin ${kind}`;
        element.style.setProperty('--pin-color', color);
        const dot = document.createElement('span');
        dot.className = 'pin-dot';
        dot.textContent = number;
        const text = document.createElement('span');
        text.className = 'pin-label';
        text.textContent = label;
        element.append(dot, text);
        return new maplibregl.Marker({ element, anchor: 'center' }).setLngLat(point).addTo(mapInstance);
    }
    function showRunners(runners) {
        latestRunners = runners;
        if (!mapInstance || !routePath.length) return;
        runnerMarkers.forEach(marker => marker.remove());
        runnerMarkers = runners.map((runner, index) => {
            const prediction = runner.date && predictionRoute
                ? RunnerPrediction.predict(runner, predictionRoute, weatherAt, Date.now())
                : {progress: runner.progress || 0};
            const point = routePath[Math.min(routePath.length - 1, Math.max(0, Math.round((prediction.progress || 0) * (routePath.length - 1))))];
            if (!point) return null;
            const name = `${runner.name || '배번'} #${runner.bib}`;
            if (prediction.state === 'unknown') return null;
            const color = runnerPinColors[index % runnerPinColors.length];
            return createMapMarker(point, name, color, 'runner', String(index + 1));
        }).filter(Boolean);
    }
    window.addEventListener('message', event => {
        if (event.source !== window.parent || event.data?.type !== 'marathon-runners' || !Array.isArray(event.data.runners)) return;
        showRunners(event.data.runners);
        updateWeather();
    });
    setInterval(() => { if (latestRunners.length) { showRunners(latestRunners); updateWeather(); } }, 30000);

    function setLoadingStep(activeId) {
        const steps = ['step-read', 'step-map', 'step-chart', 'step-analysis', 'step-done'];
        const activeIdx = steps.indexOf(activeId);
        steps.forEach((id, idx) => {
            const el = document.getElementById(id);
            if (!el) return;
            el.className = 'loading-step';
            if (idx < activeIdx) el.classList.add('done');
            else if (idx === activeIdx) el.classList.add('active');
            else el.classList.add('pending');
        });
    }

    function renderAnalysis(result, rawPoints) {
        const stats = result.stats;
        const chartData = stats.chartData || [];

        // 1. 요약 통계 출력 (RunRuun Production 정규 통계)
        const totalDist = typeof stats.totalDist === 'number' ? stats.totalDist : (stats.rawTotalDistKm || 0);
        const eleGain = typeof stats.eleGain === 'number' ? stats.eleGain : 0;
        const eleLoss = typeof stats.eleLoss === 'number' ? stats.eleLoss : 0;
        const maxEle = typeof stats.maxEle === 'number' ? stats.maxEle : 0;
        const minEle = typeof stats.minEle === 'number' ? stats.minEle : 0;

        document.getElementById('summary-distance').innerText = totalDist.toFixed(2) + ' km';
        document.getElementById('summary-ele-gain').innerText = Math.round(eleGain) + ' m';
        document.getElementById('summary-ele-loss').innerText = Math.round(eleLoss) + ' m';
        document.getElementById('summary-ele-maxmin').innerText = Math.round(maxEle) + 'm / ' + Math.round(minEle) + 'm';

        // 2. 지도 좌표
        const path = (rawPoints && rawPoints.length > 0 ? rawPoints : (result.points || [])).map(pt => [pt.lon, pt.lat]);

        // 3. 차트 포인트 다운샘플링 (최대 800개)
        const MAX_CHART_POINTS = 800;
        if (chartData.length > MAX_CHART_POINTS) {
            const step = Math.ceil(chartData.length / MAX_CHART_POINTS);
            displayChartData = [];
            for (let i = 0; i < chartData.length; i += step) {
                displayChartData.push(chartData[i]);
            }
            const lastPt = chartData[chartData.length - 1];
            if (displayChartData[displayChartData.length - 1] !== lastPt) {
                displayChartData.push(lastPt);
            }
        } else {
            displayChartData = chartData.slice();
        }

        const dataPts = displayChartData.map(d => ({ x: parseFloat(d.x), y: parseFloat(d.y) }));
        const eleRange = maxEle - minEle;
        const eleBuffer = eleRange > 0 ? eleRange * 0.05 : 10;
        const yMin = Math.max(0, Math.floor(minEle - eleBuffer));
        const yMax = Math.ceil(maxEle + eleBuffer);

        const canvas = document.getElementById('gpx-elevation-chart');
        const ctx = canvas.getContext('2d');

        if (gpxChartInstance) {
            gpxChartInstance.data.datasets[0].data = dataPts;
            gpxChartInstance.options.scales.y.min = yMin;
            gpxChartInstance.options.scales.y.max = yMax;
            gpxChartInstance.update('none');
        } else {
            gpxChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: '고도 (m)',
                        data: dataPts,
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.15)',
                        borderWidth: 2,
                        fill: true,
                        pointRadius: 0,
                        pointHoverRadius: 6,
                        pointHoverBackgroundColor: '#10b981',
                        pointHoverBorderColor: '#ffffff',
                        pointHoverBorderWidth: 2,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    interaction: { mode: 'nearest', axis: 'x', intersect: false },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: 'rgba(17, 24, 39, 0.9)',
                            titleFont: { size: 13, family: 'Inter' },
                            bodyFont: { size: 14, family: 'Inter', weight: 'bold' },
                            padding: 12,
                            cornerRadius: 8,
                            displayColors: false,
                            callbacks: {
                                title: function(context) { return '거리: ' + context[0].parsed.x.toFixed(2) + ' km'; },
                                label: function(context) { return '고도: ' + context.parsed.y.toFixed(1) + ' m'; }
                            }
                        }
                    },
                    layout: { padding: { bottom: 0, top: 4 } },
                    scales: {
                        x: {
                            type: 'linear',
                            display: true,
                            ticks: {
                                maxTicksLimit: 10,
                                font: { family: 'Inter', size: 10 },
                                padding: 2,
                                callback: function(value) { return value.toFixed(1) + ' km'; }
                            },
                            grid: { display: false }
                        },
                        y: {
                            display: true,
                            min: yMin,
                            max: yMax,
                            ticks: {
                                font: { family: 'Inter', size: 10 },
                                callback: function(value) { return value + ' m'; }
                            },
                            grid: { color: '#f3f4f6' }
                        }
                    },
                    onHover: (e, activeElements) => {
                        if (activeElements.length > 0) {
                            const index = activeElements[0].index;
                            const point = displayChartData[index];
                            if (mapInstance && hoverMarkerInstance && point) {
                                hoverMarkerInstance.setLngLat([point.lon, point.lat]);
                                if (!hoverMarkerInstance.getElement().isConnected) hoverMarkerInstance.addTo(mapInstance);
                            }
                        } else {
                            if (hoverMarkerInstance) {
                                hoverMarkerInstance.remove();
                            }
                        }
                    }
                }
            });
        }

        // 4. 지도 렌더링
        if (!mapInstance) {
            document.getElementById('gpx-loading').style.display = 'none';
            document.getElementById('gpx-map').style.display = 'block';
            document.getElementById('gpx-chart-container').style.display = 'block';
            document.getElementById('gpx-summary').style.display = 'grid';

            mapInstance = new maplibregl.Map({
                container: 'gpx-map',
                style: 'https://tiles.openfreemap.org/styles/bright',
                center: path[0] || [127.71, 37.87],
                zoom: 10,
                scrollZoom: false,
                dragRotate: false,
                pitchWithRotate: false,
                touchPitch: false,
                attributionControl: { compact: true },
                locale: { 'FullscreenControl.Enter': '지도 전체화면', 'FullscreenControl.Exit': '전체화면 닫기' }
            });
            const attribution = document.getElementById('gpx-map').querySelector('.maplibregl-ctrl-attrib');
            attribution.classList.add('maplibregl-compact');
            attribution.classList.remove('maplibregl-compact-show');
            attribution.removeAttribute('open');
            mapInstance.touchZoomRotate.disableRotation();
            mapInstance.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-left');
            const fullscreenControl = new maplibregl.FullscreenControl({ pseudo: true });
            mapInstance.addControl(fullscreenControl, 'top-right');
            const notifyFullscreen = active => {
                if (window.parent !== window) window.parent.postMessage({ type: 'marathon-map-fullscreen', active }, '*');
            };
            fullscreenControl.on('fullscreenstart', () => notifyFullscreen(true));
            fullscreenControl.on('fullscreenend', () => notifyFullscreen(false));
            const exitFullscreen = () => document.getElementById('gpx-map').querySelector('.maplibregl-ctrl-shrink')?.click();
            document.addEventListener('keydown', event => { if (event.key === 'Escape') exitFullscreen(); });
            window.addEventListener('message', event => {
                if (event.source === window.parent && event.data?.type === 'marathon-map-exit-fullscreen') exitFullscreen();
            });
            routePath = result.points.map(pt => [pt.lon, pt.lat]);
            predictionRoute = RunnerPrediction.buildRoute(result.points, RunruunElevationEngine.haversineDistanceMeters);
            courseStart = result.points[0] || null;
            const courseBounds = path.length ? new maplibregl.LngLatBounds(path[0], path[0]) : null;
            path.forEach(point => courseBounds.extend(point));
            const fitCourse = () => {
                mapInstance.resize();
                if (courseBounds) mapInstance.fitBounds(courseBounds, { padding: 32, duration: 0 });
            };
            new ResizeObserver(fitCourse).observe(document.getElementById('gpx-map'));
            mapInstance.once('style.load', () => {
                mapInstance.addSource('course', { type: 'geojson', data: {
                    type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: path }
                } });
                mapInstance.addLayer({ id: 'course', type: 'line', source: 'course',
                    layout: { 'line-join': 'round', 'line-cap': 'round' },
                    paint: { 'line-color': '#10b981', 'line-width': 4, 'line-opacity': 0.85 }
                });
                fitCourse();
            });
            if (path.length) {
                createMapMarker(path[0], '출발', '#16a34a', 'start');
                createMapMarker(path[path.length - 1], '도착', '#dc2626', 'finish');
            }
            let distanceMeters = 0;
            let nextMarkerMeters = 5000;
            for (let i = 1; i < path.length; i++) {
                const [lon, lat] = path[i - 1];
                const [nextLon, nextLat] = path[i];
                const segmentMeters = RunruunElevationEngine.haversineDistanceMeters(lat, lon, nextLat, nextLon);
                while (nextMarkerMeters <= distanceMeters + segmentMeters && segmentMeters > 0) {
                    const fraction = (nextMarkerMeters - distanceMeters) / segmentMeters;
                    const point = [lon + (nextLon - lon) * fraction, lat + (nextLat - lat) * fraction];
                    createMapMarker(point, `${nextMarkerMeters / 1000} km`, '#2563eb');
                    nextMarkerMeters += 5000;
                }
                distanceMeters += segmentMeters;
            }

            const hoverElement = document.createElement('div');
            hoverElement.className = 'chart-hover-pin';
            hoverElement.style.pointerEvents = 'none';
            hoverMarkerInstance = new maplibregl.Marker({ element: hoverElement }).setLngLat(path[0] || [0, 0]);
            showRunners(latestRunners);
            updateWeather();

            if (gpxChartInstance) {
                setTimeout(() => { gpxChartInstance.resize(); }, 150);
            }
        }
    }

    async function initGpxViewer() {
        try {
            if (!GPX_URL) {
                document.getElementById('gpx-loading').innerHTML = '<div style="padding:40px;text-align:center;font-size:15px;color:#6b7280;">GPX URL이 제공되지 않았습니다.<br>iframe 주소 뒤에 <code>?url=깃허브Raw주소</code>를 추가해주세요.</div>';
                return;
            }

            setLoadingStep('step-read');
            let response;
            try {
                response = await fetch(GPX_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
            } catch (primaryError) {
                if (!FALLBACK_URL) throw primaryError;
                response = await fetch(FALLBACK_URL, { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } });
            }
            if (!response.ok) throw new Error('네트워크 응답이 정상이 아닙니다.');
            const isRouteJson = response.url.includes('wari-jtbc-route') || response.headers.get('content-type')?.includes('application/json');
            const gpxText = isRouteJson
                ? `<gpx><trk><trkseg>${(await response.json()).points.map(p => `<trkpt lat="${p.latitude}" lon="${p.longitude}"><ele>${p.elevation || 0}</ele></trkpt>`).join('')}</trkseg></trk></gpx>`
                : await response.text();

            if (typeof RunruunElevationEngine === 'undefined') {
                throw new Error('RunRuun 고도 엔진(RunruunElevationEngine)을 불러올 수 없습니다.');
            }

            setLoadingStep('step-analysis');
            const result = await RunruunElevationEngine.processGpx(gpxText, { profile: 'road' });
            const rawParsed = RunruunElevationEngine.parseGpx(gpxText);

            setLoadingStep('step-map');
            setLoadingStep('step-chart');
            renderAnalysis(result, rawParsed);
            setLoadingStep('step-done');

        } catch (error) {
            console.error('GPX 로딩 에러:', error);
            document.getElementById('gpx-loading').innerHTML = '<div style="padding:40px;text-align:center;font-size:15px;color:#6b7280;">데이터를 불러오는 데 실패했습니다. URL을 확인해주세요. (' + error.message + ')</div>';
        }
    }

    initGpxViewer();
</script>
</body>
</html>
